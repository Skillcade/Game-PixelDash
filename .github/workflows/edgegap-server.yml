name: Edgegap — Server Build & Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to deploy (e.g. main, v1.8.0)'
        required: false
        default: ''
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Docker image version tag (e.g. v1.8.0)'
        required: true
        type: string
      build_config:
        description: 'Build config asset path override (optional, leave blank to use vars.SERVER_BUILD_CONFIG)'
        required: false
        default: ''

concurrency:
  group: unity-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      - name: Build server (Unity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.68f1
          targetPlatform: StandaloneLinux64
          buildMethod: SkillcadeSDK.Editor.BuildScript.BuildFromCommandLine
          # BuildScript outputs to Builds/EdgegapServer/ — Dockerfile copies from there
          customParameters: -buildConfig ${{ inputs.build_config || vars.SERVER_BUILD_CONFIG }}

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: Builds/
          if-no-files-found: warn

      - name: Generate Dockerfile
        run: |
          [ -d Builds ] && sudo chown -R "$(whoami)" Builds/
          mkdir -p Builds
          cat > Builds/Dockerfile << 'DOCKERFILE_EOF'
          FROM ubuntu:22.04

          ARG DEBIAN_FRONTEND=noninteractive
          ARG SERVER_BUILD_PATH=EdgegapServer

          COPY ${SERVER_BUILD_PATH} /root/build/

          WORKDIR /root/

          RUN chmod +x /root/build/ServerBuild

          RUN apt-get update && \
              apt-get install -y ca-certificates && \
              apt-get clean && \
              update-ca-certificates

          CMD ["/bin/bash", "-c", "env;/root/build/ServerBuild -batchmode -nographics $UNITY_COMMANDLINE_ARGS"]
          DOCKERFILE_EOF

      - name: Docker build
        run: |
          docker build --no-cache --platform linux/amd64 \
            -t "${{ secrets.EDGEGAP_IMAGE_NAME }}" \
            Builds/

      - name: Login to Edgegap registry
        env:
          EDGEGAP_USERNAME: ${{ secrets.EDGEGAP_USERNAME }}
          EDGEGAP_PASSWORD: ${{ secrets.EDGEGAP_PASSWORD }}
        run: |
          echo $EDGEGAP_PASSWORD | docker login -u "$EDGEGAP_USERNAME" --password-stdin registry.edgegap.com

      - name: Tag and push image
        run: |
          TAG="registry.edgegap.com/${{ secrets.EDGEGAP_PROJECT_NAME }}/${{ secrets.EDGEGAP_IMAGE_NAME }}:${{ inputs.version }}"
          docker tag "${{ secrets.EDGEGAP_IMAGE_NAME }}" "$TAG"
          docker push "$TAG"

      - name: Update Edgegap app version
        run: |
          curl -sf -w "\nHTTP %{http_code}" -X PATCH \
            "https://api.edgegap.com/v1/app/${{ vars.EDGEGAP_APP_NAME }}/version/${{ vars.EDGEGAP_VERSION_NAME }}" \
            -H "Authorization: token ${{ secrets.EDGEGAP_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_tag\": \"${{ inputs.version }}\"}"

      - name: Docker logout
        if: always()
        run: docker logout registry.edgegap.com
